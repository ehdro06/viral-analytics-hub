spring.datasource.url=jdbc:h2:mem:virallink_analytics;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Overridden by AnalyticsApplicationTests @DynamicPropertySource (Testcontainers Redis)
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379

jwt.secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
api.key.signing-secret=test-api-key-signing-secret-min-32-chars!!

management.otlp.metrics.export.enabled=false
logging.level.com.virallink.analytics=WARN
