spring.application.name=user

# Local secrets/config (git-ignored). `optional:` = fine if absent, e.g. when real env vars are used instead.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# Frontend origin: post-login redirect target and the only origin allowed by CORS
app.frontend-url=${FRONTEND_URL:http://localhost:3001}

# Virtual Threads
spring.threads.virtual.enabled=true

# Database (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5433/virallink_user
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Spring Session: Redis is the real session store, so nothing is lost across a restart.
spring.session.store-type=redis
# 30 days session
spring.session.timeout=30d

# DevTools (developmentOnly dependency) also defaults Tomcat's OWN on-disk session persistence to
# true, unrelated to Spring Session above. On Windows the directory it uses under %TEMP% can be left
# with the wrong owner by an earlier run, which then fails Tomcat's ownership check at startup
# ("... is not owned by BUILTIN\Administrators"). Turn it off; Redis is the source of truth anyway.
server.servlet.session.persistent=false

# JWT
jwt.secret=${JWT_SECRET}
# API Key signing secret for self-verifiable prefix.secret keys
api.key.signing-secret=${API_KEY_SIGNING_SECRET}

# OAuth2 (Placeholders - user needs to fill these)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email,read:user
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Logging
logging.level.org.springframework.security=DEBUG
