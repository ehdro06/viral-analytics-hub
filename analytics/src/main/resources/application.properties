server.port=8082
spring.application.name=analytics

# Virtual Threads
spring.threads.virtual.enabled=true

# Database (PostgreSQL) - Analytics Service DB
spring.datasource.url=jdbc:postgresql://localhost:5433/virallink_analytics
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# Redis Cache (Shared with Redirect Service for Streams)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Logging
logging.level.com.virallink.analytics=DEBUG

# Disable OTLP Metrics Export (No OpenTelemetry Collector running locally)
management.otlp.metrics.export.enabled=false

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.tracing.export.enabled=false

logging.level.io.lettuce.core.RedisHandshake=WARN

# JWT (shared secret with user/redirect services)
jwt.secret=${JWT_SECRET}
# API Key signing secret for verifying X-API-Key prefix.secret tokens
api.key.signing-secret=${API_KEY_SIGNING_SECRET}

# Redis stream consumer (sponge)
analytics.sponge.batch-size=100
analytics.sponge.read-block-ms=100
analytics.sponge.poll-interval-ms=1000

# Geo enrichment toggle (keep OFF by default for GDPR; enable when mmdb is available)
analytics.geo.city.enabled=false
#analytics.geo.city.mmdb-path=${GEOLITE_PATH}