# Production profile (Cloud Run). Activate with SPRING_PROFILES_ACTIVE=prod.
# Everything else comes from application.properties + environment variables: see docs/DEPLOY.md.

# Neon caps connections per compute, and 3 services x N Cloud Run instances add up quickly.
# DB_URL must keep ?reWriteBatchedInserts=true (plus sslmode=require for Neon).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=1

# RISK (not changed here): spring.jpa.hibernate.ddl-auto=update is inherited from application.properties, so every
# instance start may ALTER the production schema, and it never drops or renames anything. Override per service with
# SPRING_JPA_HIBERNATE_DDL_AUTO=validate once the schema is stable (and move to Flyway/Liquibase migrations).

# Cloud Run sends SIGTERM and kills the container 10s later. A sponge batch cut off mid-flight is not lost
# (it is only ACKed after the DB commit) but may be written twice if the kill lands between commit and ACK.
spring.lifecycle.timeout-per-shutdown-phase=8s

# No polling on Cloud Run: Cloud Scheduler calls POST /internal/sponge/drain every minute (needs SPONGE_TRIGGER_TOKEN),
# so the service can run with request-based billing and scale to zero. Clicks wait in the Redis stream meanwhile.
analytics.sponge.mode=${SPONGE_MODE:on-demand}

# Logging
logging.level.com.virallink.analytics=INFO
