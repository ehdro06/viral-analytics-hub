# Cloud Run injects PORT; local dev falls back to 8082.
server.port=${PORT:8082}
spring.application.name=analytics

# Local secrets/config (git-ignored). `optional:` = fine if absent, e.g. when real env vars are used instead.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# Virtual Threads
spring.threads.virtual.enabled=true

# DevTools (developmentOnly dependency) defaults this to true so sessions survive its auto-restart.
# This service is stateless (JWT only, no HTTP sessions), and on Windows the on-disk session store
# it creates under %TEMP% can be left with the wrong owner by an earlier run, which then fails
# Tomcat's directory-ownership check at startup ("... is not owned by BUILTIN\Administrators").
# Nothing here needs session persistence, so turn it off instead of relying on that temp directory.
server.servlet.session.persistent=false

# Database (PostgreSQL) - Analytics Service DB. Defaults = docker compose; production sets DB_URL/DB_USERNAME/DB_PASSWORD.
# Keep reWriteBatchedInserts=true in DB_URL too: the sponge's JDBC batches rely on it.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/virallink_analytics?reWriteBatchedInserts=true}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Redis (shared with the redirect service: click events arrive on a Redis Stream). Empty password = no AUTH.
# Alternatively set SPRING_DATA_REDIS_URL (redis:// or rediss://), which takes precedence over host/port/password/ssl.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# JWT (shared secret with the user service)
jwt.secret=${JWT_SECRET}

# Logging
logging.level.com.virallink.analytics=DEBUG
logging.level.io.lettuce.core.RedisHandshake=WARN

# Disable OTLP Metrics Export (No OpenTelemetry Collector running locally)
management.otlp.metrics.export.enabled=false
management.tracing.export.enabled=false

# Actuator (health is public, details only for authenticated callers)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Geo enrichment with a local MaxMind GeoLite2-City database (no API key needed to read it).
# Only ever sees the anonymised IP. Disabled automatically if the file is missing.
analytics.geo.city.enabled=true
analytics.geo.city.mmdb-path=${GEOLITE_PATH:./data/GeoLite2-City.mmdb}
