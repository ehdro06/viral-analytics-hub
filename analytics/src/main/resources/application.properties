server.port=8082
spring.application.name=analytics

# Local secrets/config (git-ignored). `optional:` = fine if absent, e.g. when real env vars are used instead.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# Virtual Threads
spring.threads.virtual.enabled=true

# Database (PostgreSQL) - Analytics Service DB
spring.datasource.url=jdbc:postgresql://localhost:5433/virallink_analytics?reWriteBatchedInserts=true
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Redis (shared with the redirect service: click events arrive on a Redis Stream)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT (shared secret with the user service)
jwt.secret=${JWT_SECRET}

# Logging
logging.level.com.virallink.analytics=DEBUG
logging.level.io.lettuce.core.RedisHandshake=WARN

# Disable OTLP Metrics Export (No OpenTelemetry Collector running locally)
management.otlp.metrics.export.enabled=false
management.tracing.export.enabled=false

# Actuator (health is public, details only for authenticated callers)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Geo enrichment with a local MaxMind GeoLite2-City database (no API key needed to read it).
# Only ever sees the anonymised IP. Disabled automatically if the file is missing.
analytics.geo.city.enabled=true
analytics.geo.city.mmdb-path=${GEOLITE_PATH:./data/GeoLite2-City.mmdb}
