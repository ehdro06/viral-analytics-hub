server.port=8081
spring.application.name=redirect

# Virtual Threads
spring.threads.virtual.enabled=true

# Database (PostgreSQL) - Redirect Service DB
spring.datasource.url=jdbc:postgresql://localhost:5433/virallink_redirect
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Redis Cache (L1)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=600000 # 10 minutes cache TTL

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.virallink.redirect=DEBUG

# Safe Browsing (Placeholder)
google.safebrowsing.api-key={SAFE_BROWSING_API_KEY}
google.safebrowsing.enabled=false

# Hashids
hashids.salt=${HASHIDS_SALT}
hashids.min-length=6

# JWT
jwt.secret=${JWT_SECRET}
