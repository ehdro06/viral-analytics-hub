name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JWT_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  API_KEY_SIGNING_SECRET: ci-api-key-signing-secret-min-32-chars!!
  HASHIDS_SALT: ci-hashids-salt

jobs:
  backend:
    name: Backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user, redirect, analytics]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        working-directory: ${{ matrix.service }}
        run: chmod +x gradlew

      - name: Build and test
        working-directory: ${{ matrix.service }}
        run: ./gradlew build --no-daemon

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viral-analytics-hub
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Not setup-node's `cache: pnpm`: it resolves the store from the repo root (global store), but
      # viral-analytics-hub/.npmrc sets store-dir=.pnpm-store, so that path never exists and the post-job
      # cache save fails the job. Cache the store pnpm actually uses instead.
      - uses: actions/cache@v4
        with:
          path: viral-analytics-hub/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('viral-analytics-hub/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Production build
        run: pnpm run build
