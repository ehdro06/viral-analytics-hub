spring.datasource.url=jdbc:h2:mem:virallink_redirect;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.cache.type=none

# Overridden by RedirectApplicationTests @DynamicPropertySource (Testcontainers Redis)
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379

jwt.secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
api.key.signing-secret=test-api-key-signing-secret-min-32-chars!!
hashids.salt=test-hashids-salt
hashids.min-length=6

google.safebrowsing.api-key=
google.safebrowsing.enabled=false

logging.level.virallink.redirect=WARN
