# Production profile (Cloud Run). Activate with SPRING_PROFILES_ACTIVE=prod.
# Everything else comes from application.properties + environment variables: see docs/DEPLOY.md.

# Neon caps connections per compute, and 3 services x N Cloud Run instances add up quickly.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=1

# RISK (not changed here): spring.jpa.hibernate.ddl-auto=update is inherited from application.properties, so every
# instance start may ALTER the production schema, and it never drops or renames anything. Override per service with
# SPRING_JPA_HIBERNATE_DDL_AUTO=validate once the schema is stable (and move to Flyway/Liquibase migrations).

# The browser only ever sees the Vercel origin: OAuth starts and returns through the Next.js rewrites there, so the
# session cookie stays first-party. Pin the redirect URI to that origin instead of deriving {baseUrl} from whatever
# Host/X-Forwarded-Host headers survive Vercel -> Cloud Run. Must match the URI registered at Google/GitHub.
spring.security.oauth2.client.registration.google.redirect-uri=${OAUTH2_REDIRECT_BASE_URL:${app.frontend-url}}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.github.redirect-uri=${OAUTH2_REDIRECT_BASE_URL:${app.frontend-url}}/login/oauth2/code/{registrationId}

# Session cookie: always Secure in production (the public origin is https), even if a proxy hop drops X-Forwarded-Proto.
server.servlet.session.cookie.secure=true

# Cloud Run sends SIGTERM and kills the container 10s later: finish in-flight requests within that window.
spring.lifecycle.timeout-per-shutdown-phase=8s

# Logging: no DEBUG security traces in production (they log request details on every call).
logging.level.org.springframework.security=INFO
