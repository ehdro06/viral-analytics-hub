spring.application.name=user
# Cloud Run injects PORT; local dev falls back to 8080.
server.port=${PORT:8080}

# Local secrets/config (git-ignored). `optional:` = fine if absent, e.g. when real env vars are used instead.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# Frontend origin: post-login redirect target and the only origin allowed by CORS
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Virtual Threads
spring.threads.virtual.enabled=true

# Behind a TLS-terminating proxy (Cloud Run, Vercel rewrites) trust X-Forwarded-Proto/-Host from internal proxies,
# so request.isSecure() and {baseUrl} reflect the public https URL. Same strategy as the redirect service.
server.forward-headers-strategy=native

# Database (PostgreSQL). Defaults = docker compose; production sets DB_URL/DB_USERNAME/DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/virallink_user}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update

# Redis (session store). Empty password = no AUTH. Alternatively set SPRING_DATA_REDIS_URL (redis:// or rediss://),
# which takes precedence over host/port/password/ssl.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# Spring Session: Redis is the real session store (spring-boot-starter-session-data-redis), so nothing is lost
# across a restart and any instance can serve any session. Store selection is by classpath in Boot 4.
# 30 days session
spring.session.timeout=30d

# DevTools (developmentOnly dependency) also defaults Tomcat's OWN on-disk session persistence to
# true, unrelated to Spring Session above. On Windows the directory it uses under %TEMP% can be left
# with the wrong owner by an earlier run, which then fails Tomcat's ownership check at startup
# ("... is not owned by BUILTIN\Administrators"). Turn it off; Redis is the source of truth anyway.
server.servlet.session.persistent=false

# JWT
jwt.secret=${JWT_SECRET}
# API Key signing secret for self-verifiable prefix.secret keys
api.key.signing-secret=${API_KEY_SIGNING_SECRET}

# OAuth2 (Placeholders - user needs to fill these)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email,read:user
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Logging
logging.level.org.springframework.security=DEBUG
