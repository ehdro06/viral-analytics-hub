server.port=8081
spring.application.name=redirect

# Local secrets/config (git-ignored). `optional:` = fine if absent, e.g. when real env vars are used instead.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# Virtual Threads
spring.threads.virtual.enabled=true

# DevTools (developmentOnly dependency) defaults this to true so sessions survive its auto-restart.
# This service is stateless (JWT only, no HTTP sessions), and on Windows the on-disk session store
# it creates under %TEMP% can be left with the wrong owner by an earlier run, which then fails
# Tomcat's directory-ownership check at startup ("... is not owned by BUILTIN\Administrators").
# Nothing here needs session persistence, so turn it off instead of relying on that temp directory.
server.servlet.session.persistent=false

# Client IP: only trust X-Forwarded-For when the request comes from a trusted proxy (Tomcat's remote-ip valve).
# Behind a load balancer outside the private ranges, set server.tomcat.remoteip.internal-proxies accordingly.
server.forward-headers-strategy=native

# Database (PostgreSQL) - Redirect Service DB
spring.datasource.url=jdbc:postgresql://localhost:5433/virallink_redirect
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Redis Cache (L1). Short timeouts: a slow Redis must degrade to Postgres quickly, not stall every redirect.
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=300ms

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.virallink.redirect=DEBUG

# Google Safe Browsing (optional: the check is skipped whenever the API key is empty)
google.safebrowsing.api-key=${SAFE_BROWSING_API_KEY:}
google.safebrowsing.enabled=${SAFE_BROWSING_ENABLED:true}

# Hashids
hashids.salt=${HASHIDS_SALT}
hashids.min-length=6

# JWT (shared secret with the user service)
jwt.secret=${JWT_SECRET}
# API Key signing secret for verifying X-API-Key prefix.secret tokens
api.key.signing-secret=${API_KEY_SIGNING_SECRET}
